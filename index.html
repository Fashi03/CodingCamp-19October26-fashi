<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <h1 class="app-title">Life Dashboard</h1>
    <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark / light theme">
      🌙
    </button>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard-grid">

    <!-- ── GREETING WIDGET ── -->
    <section id="greeting" aria-labelledby="greeting-heading">
      <h2 id="greeting-heading" class="widget-title">Greeting</h2>

      <!-- Live clock display -->
      <div class="greeting-display">
        <p id="greeting-text" class="greeting-text">Good Morning, Friend</p>
        <p id="greeting-date" class="greeting-date"></p>
        <p id="greeting-time" class="greeting-time"></p>
      </div>

      <!-- Name input form -->
      <form id="name-form" class="name-form" novalidate>
        <label for="name-input" class="form-label">Your name</label>
        <div class="input-row">
          <input
            type="text"
            id="name-input"
            class="form-input"
            placeholder="Enter your name (1–50 chars)"
            maxlength="50"
            autocomplete="off"
            aria-describedby="name-error"
          />
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
        <!-- Error message injected here by JS: <p class="error-msg" role="alert"> -->
      </form>
    </section>

    <!-- ── TIMER WIDGET ── -->
    <section id="timer" aria-labelledby="timer-heading">
      <h2 id="timer-heading" class="widget-title">Focus Timer</h2>

      <!-- Countdown display -->
      <p id="timer-display" class="timer-display" aria-live="polite">25:00</p>

      <!-- Completion message (hidden until timer ends) -->
      <p id="timer-complete" class="timer-complete" aria-live="assertive" hidden></p>

      <!-- Controls -->
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop"  class="btn btn-secondary" disabled>Stop</button>
        <button id="timer-reset" class="btn btn-secondary">Reset</button>
      </div>
    </section>

    <!-- ── TO-DO LIST WIDGET ── -->
    <section id="todo" aria-labelledby="todo-heading">
      <h2 id="todo-heading" class="widget-title">To-Do List</h2>

      <!-- Add task form -->
      <form id="task-form" class="task-form" novalidate>
        <label for="task-input" class="form-label">New task</label>
        <div class="input-row">
          <input
            type="text"
            id="task-input"
            class="form-input"
            placeholder="Enter a task (1–200 chars)"
            maxlength="200"
            autocomplete="off"
            aria-describedby="task-error"
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
        <!-- Error message injected here by JS: <p class="error-msg" role="alert"> -->
      </form>

      <!-- Error container for storage failures -->
      <div id="todo-error-container" class="error-container" aria-live="polite"></div>

      <!-- Task list — populated by JS -->
      <ul id="task-list" class="task-list" aria-label="Task list">
        <!-- Items rendered by App.Todo._render() -->
      </ul>
    </section>

    <!-- ── QUICK LINKS WIDGET ── -->
    <section id="links" aria-labelledby="links-heading">
      <h2 id="links-heading" class="widget-title">Quick Links</h2>

      <!-- Add link form -->
      <form id="link-form" class="link-form" novalidate>
        <div class="form-group">
          <label for="link-label-input" class="form-label">Label</label>
          <input
            type="text"
            id="link-label-input"
            class="form-input"
            placeholder="e.g. GitHub (1–100 chars)"
            maxlength="100"
            autocomplete="off"
            aria-describedby="link-label-error"
          />
          <!-- Error message injected here by JS -->
        </div>
        <div class="form-group">
          <label for="link-url-input" class="form-label">URL</label>
          <input
            type="url"
            id="link-url-input"
            class="form-input"
            placeholder="https://example.com"
            autocomplete="off"
            aria-describedby="link-url-error"
          />
          <!-- Error message injected here by JS -->
        </div>
        <button type="submit" class="btn btn-primary">Add Link</button>
        <!-- Error message injected here by JS: <p class="error-msg" role="alert"> -->
      </form>

      <!-- Error container for storage / cap failures -->
      <div id="links-error-container" class="error-container" aria-live="polite"></div>

      <!-- Links list — populated by JS -->
      <div id="links-list" class="links-list" aria-label="Quick links">
        <!-- Buttons rendered by App.Links._render() -->
      </div>
    </section>

  </main>

  <script defer src="js/app.js"></script>
</body>
</html>
